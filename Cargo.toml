[package]
authors = ["konomanoasa"]
autoexamples = false
categories = ["parser-implementations", "parsing", "text-editors"]
description = "Tree-sitter grammar for POSIX sh."
edition = "2024"
keywords = ["incremental", "parsing", "tree-sitter", "sh", "shell"]
license = "MIT"
name = "tree-sitter-sh"
readme = "README.md"
repository = "https://github.com/konomanoasa/tree-sitter-sh"
version = "0.5.0"

build = "bindings/rust/build.rs"
include = [
  "/LICENSE",
  "/README.md",
  "/bindings/rust/*.rs",
  "/grammar.js",
  "/queries/*.scm",
  "/src/grammar.json",
  "/src/node-types.json",
  "/src/parser.c",
  "/src/scanner.c",
  "/src/tree_sitter/*.h",
  "/tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.0"
