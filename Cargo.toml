[package]
name = "tree-sitter-sh"
version = "0.13.0"
edition = "2024"
authors = ["konomanoasa"]
description = "Tree-sitter grammar for POSIX sh."
license = "MIT"
readme = "README.md"
repository = "https://github.com/konomanoasa/tree-sitter-sh"
categories = ["parser-implementations", "parsing", "text-editors"]
keywords = ["incremental", "parsing", "tree-sitter", "sh"]
build = "bindings/rust/build.rs"
include = [
    "/bindings/rust/*.rs",
    "/grammar.js",
    "/queries/*.scm",
    "/src/*.c",
    "/src/*.h",
    "/src/*.json",
    "/src/tree_sitter/*.h",
    "/tree-sitter.json",
    "/LICENSE",
    "/README.md",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1.8"

[build-dependencies]
cc = "1.4.6"

[dev-dependencies]
tree-sitter = "0.27.0"
